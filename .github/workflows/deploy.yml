name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy production
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      - name: Prepare preview
        if: github.event_name == 'pull_request'
        id: preview
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          preview_name="pr-$PR_NUMBER"
          if [[ "$HEAD_REF" == feat/* ]]; then
            preview_name="${HEAD_REF#feat/}"
          fi
          if [[ ! "$preview_name" =~ ^[a-z0-9]+([a-z0-9-]*[a-z0-9])?$ ]] || [[ ${#preview_name} -gt 42 ]]; then
            preview_name="pr-$PR_NUMBER"
          fi
          echo "worker=poncue-preview-$preview_name" >> "$GITHUB_OUTPUT"
          echo "domain=$preview_name.poncue.dev.nopo1.com" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_WORKER: ${{ steps.preview.outputs.worker }}
          PREVIEW_DOMAIN: ${{ steps.preview.outputs.domain }}
        run: >-
          bunx wrangler deploy
          --config wrangler.preview.jsonc
          --name "$PREVIEW_WORKER"
          --domain "$PREVIEW_DOMAIN"
