<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>リモコン | ポン出し</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body class="remote-page dark-mode">
    <div class="remote-panel">
      <div class="remote-header">
        <span class="remote-title"><i class="fas fa-tower-broadcast"></i> リモコン</span>
        <span class="remote-status"><span class="remote-dot"></span><span id="remote-status-text">未接続</span></span>
        <button id="remote-room-chip" class="remote-room-chip" hidden title="タップでルームを変更"></button>
        <span id="remote-meta" class="remote-meta"></span>
        <button id="remote-theme-btn" class="remote-close-btn" aria-label="テーマ切り替え"></button>
      </div>
      <div id="remote-body" class="remote-body"></div>
    </div>
    <script type="module" src="/modules/remote_controller.js"></script>
  </body>
</html>
